version: "3.9"

services:
  db:
    image: postgres:15
    container_name: ecart-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    container_name: ecart-backend
    build:
      context: ./ecartsystem
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - rabbitmq
    env_file:
      - .env
    volumes:
      - ./ecartsystem:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  
  frontend:
    container_name: react-dev
    build:
      context: ./REACT/my-app
    working_dir: /app
    volumes:
      - ./REACT/my-app:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  consumer:
    container_name: otp-consumer
    build:
      context: ./ecartsystem
    depends_on:
      - rabbitmq
      - redis
    env_file:
      - .env
    volumes:
      - ./ecartsystem:/app
    command: python app/services/otp_email_consumer.py

volumes:
  redis-data:
  rabbitmq_data:
  postgres_data: